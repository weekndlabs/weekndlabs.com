<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WeekndLabs">
  <title>WeekndLabs</title>
  <defs>
    <!-- Same plate gradient as Bubo's app icon: lit from the top, sinking to
         the night background. Keeps the two marks reading as one family. -->
    <linearGradient id="wl-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3050"/>
      <stop offset="1" stop-color="#12141F"/>
    </linearGradient>
    <linearGradient id="wl-disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#525B80"/>
      <stop offset="1" stop-color="#3E4665"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#wl-plate)"/>

  <!-- Bubo sets its amber features on a lighter slate body. Same recipe here,
       so the W sits on a disc rather than floating on the plate. -->
  <circle cx="256" cy="262" r="152" fill="url(#wl-disc)"/>

  <path d="M152 192 L210 330 L256 236 L302 330 L360 192"
        fill="none" stroke="#F5B841" stroke-width="36"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal cursor, sitting where Bubo's beak does. Reads as a prompt. -->
  <rect x="234" y="362" width="44" height="15" rx="7.5" fill="#F5B841"/>
</svg>
